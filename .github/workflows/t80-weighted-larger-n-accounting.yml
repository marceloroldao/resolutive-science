name: T80 weighted larger N accounting

on:
  push:
    branches:
      - work/v0.5-relational-ontology
    paths:
      - 'src/v05/t80_weighted_larger_n_accounting.py'
      - '.github/workflows/t80-weighted-larger-n-accounting.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t80:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Execute frozen T80 weighted larger-N accounting
        run: |
          set -euo pipefail
          python src/v05/t80_weighted_larger_n_accounting.py > t80_result.json
          cat t80_result.json
      - name: Preserve raw T80 output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t80-weighted-larger-n-accounting
          path: t80_result.json
          if-no-files-found: error
