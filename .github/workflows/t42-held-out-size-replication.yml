name: T42 held-out size replication

on:
  push:
    branches:
      - work/v0.5-relational-ontology
    paths:
      - 'src/v05/t42_held_out_size_replication.py'
      - 'src/v05/t41_higher_order_matched_tree_null.py'
      - 'src/v05/t39_higher_order_topology_source.py'
      - 'src/v05/t38_degree_matched_tree_null.py'
      - 'src/v05/t25_endogenous_dimension_scan.py'
      - '.github/workflows/t42-held-out-size-replication.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t42:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Execute frozen T42
        run: |
          set -euo pipefail
          python src/v05/t42_held_out_size_replication.py > t42_result.json
          cat t42_result.json

      - name: Preserve raw T42 result
        uses: actions/upload-artifact@v4
        with:
          name: t42-held-out-size-replication
          path: t42_result.json
          if-no-files-found: error
