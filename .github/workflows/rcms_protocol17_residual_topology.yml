name: RCMS Protocol 17 Residual Topology

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/run_rcms_protocol17_residual_topology.py'
      - 'docs/RCMS/protocols/protocol17_residual_topology_sign_map.md'
      - 'data/rcms/desi_dr2_bao_all_mean.txt'
      - 'data/rcms/desi_dr2_bao_all_cov.txt'
      - '.github/workflows/rcms_protocol17_residual_topology.yml'
  workflow_dispatch:

jobs:
  p17:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install numpy
      - name: Execute preregistered P17-A diagnostic
        run: python tools/run_rcms_protocol17_residual_topology.py
      - name: Verify P17 identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/rcms_protocol17_residual_topology.json').read_text())
          assert d['protocol']=='P17-A'
          assert d['status']=='FINAL'
          assert set(d['surveys'])=={'DESI_DR2','BOSS_DR12'}
          assert d['classification'] in {
              'CHANNEL_ORGANIZED_TENSION',
              'REDSHIFT_ORGANIZED_TENSION',
              'DIFFUSE_RESIDUAL_STRUCTURE',
          }
          assert abs(d['surveys']['DESI_DR2']['RCMS']['fit']['A_R']-0.21)<1e-12
          assert abs(d['surveys']['BOSS_DR12']['RCMS']['fit']['A_R']+1.0)<1e-12
          print('P17_FINAL_IDENTITY=PASS')
          print('P17_CLASSIFICATION='+d['classification'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcms-protocol17-residual-topology
          path: results/rcms_protocol17_residual_topology.json
          if-no-files-found: error
