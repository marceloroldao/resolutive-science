name: T63 parent-child age alignment

on:
  push:
    branches:
      - work/v0.5-relational-ontology
    paths:
      - 'src/v05/t63_parent_child_age_alignment.py'
      - '.github/workflows/t63-parent-child-age-alignment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t63:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute frozen T63 age-alignment null test
        run: |
          set -euo pipefail
          python src/v05/t63_parent_child_age_alignment.py > t63_result.json
          cat t63_result.json
      - name: Preserve raw T63 output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t63-parent-child-age-alignment
          path: t63_result.json
          if-no-files-found: error
