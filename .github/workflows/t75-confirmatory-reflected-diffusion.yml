name: T75 confirmatory reflected diffusion

on:
  push:
    branches:
      - work/v0.5-relational-ontology
    paths:
      - 'src/v05/t75_confirmatory_reflected_diffusion.py'
      - '.github/workflows/t75-confirmatory-reflected-diffusion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t75:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Execute frozen T75 confirmatory test
        run: |
          set -euo pipefail
          python src/v05/t75_confirmatory_reflected_diffusion.py > t75_result.json
          cat t75_result.json
      - name: Preserve raw T75 output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t75-confirmatory-reflected-diffusion
          path: t75_result.json
          if-no-files-found: error
