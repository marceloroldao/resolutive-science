name: RCMS synthetic tests

on:
  pull_request:
    paths:
      - 'rcms/**'
      - 'tests/test_rcms_synthetic.py'
      - 'tools/run_rcms_synthetic.py'
      - 'tools/run_rcms_multiseed.py'
      - 'tools/run_rcms_effective_compare.py'
      - 'tools/run_rcms_nuisance_refit.py'
      - 'tools/run_rcms_detection_power.py'
      - 'tools/run_rcms_multiobservable.py'
      - 'tools/run_rcms_probe_ablation.py'
      - 'tools/run_rcms_calibration_nuisance.py'
      - 'tools/run_rcms_full_vs_effective.py'
      - 'docs/RCMS/**'
      - '.github/workflows/rcms-synthetic.yml'
  push:
    branches: [main]
    paths:
      - 'rcms/**'
      - 'tests/test_rcms_synthetic.py'
      - 'tools/run_rcms_synthetic.py'
      - 'tools/run_rcms_multiseed.py'
      - 'tools/run_rcms_effective_compare.py'
      - 'tools/run_rcms_nuisance_refit.py'
      - 'tools/run_rcms_detection_power.py'
      - 'tools/run_rcms_multiobservable.py'
      - 'tools/run_rcms_probe_ablation.py'
      - 'tools/run_rcms_calibration_nuisance.py'
      - 'tools/run_rcms_full_vs_effective.py'
      - 'docs/RCMS/**'
      - '.github/workflows/rcms-synthetic.yml'

jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and falsification tests
        run: python -m unittest tests/test_rcms_synthetic.py -v
      - name: Reproducible benchmark report
        env:
          PYTHONPATH: .
        run: python tools/run_rcms_synthetic.py
      - name: Multi-seed calibration
        env:
          PYTHONPATH: .
        run: python tools/run_rcms_multiseed.py
      - name: Effective-amplitude comparison
        env:
          PYTHONPATH: .
        run: python tools/run_rcms_effective_compare.py
      - name: Nuisance-parameter refit
        env:
          PYTHONPATH: .
        run: python tools/run_rcms_nuisance_refit.py
      - name: Detection-power map
        env:
          PYTHONPATH: .
        run: python tools/run_rcms_detection_power.py
      - name: Multiobservable joint benchmark
        env:
          PYTHONPATH: .
        run: python tools/run_rcms_multiobservable.py
      - name: Probe ablation benchmark
        env:
          PYTHONPATH: .
        run: python tools/run_rcms_probe_ablation.py
      - name: Calibration-nuisance benchmark
        env:
          PYTHONPATH: .
        run: python tools/run_rcms_calibration_nuisance.py
      - name: Full-vs-effective RCMS benchmark
        env:
          PYTHONPATH: .
        run: python tools/run_rcms_full_vs_effective.py
