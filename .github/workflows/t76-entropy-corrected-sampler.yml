name: T76 entropy corrected sampler validation

on:
  push:
    branches:
      - work/v0.5-relational-ontology
    paths:
      - 'src/v05/t76_entropy_corrected_sampler.py'
      - '.github/workflows/t76-entropy-corrected-sampler.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t76:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Execute frozen T76 corrected sampler validation
        run: |
          set -euo pipefail
          python src/v05/t76_entropy_corrected_sampler.py > t76_result.json
          cat t76_result.json
      - name: Preserve raw T76 output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t76-entropy-corrected-sampler
          path: t76_result.json
          if-no-files-found: error
