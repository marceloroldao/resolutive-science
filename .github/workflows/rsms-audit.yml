name: RSMS audit

on:
  pull_request:
    paths:
      - 'docs/RSMS/**'
      - 'tools/audit_rsms.py'
      - 'tools/build_rsms_registries.py'
      - '.github/workflows/rsms-audit.yml'
  push:
    branches: [main]
    paths:
      - 'docs/RSMS/**'
      - 'tools/audit_rsms.py'
      - 'tools/build_rsms_registries.py'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cross-chapter audit
        run: python tools/audit_rsms.py --baseline main

      - name: Generate machine-readable registries
        run: python tools/build_rsms_registries.py --output-dir build/rsms_registries

      - name: Validate generated registry JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('build/rsms_registries').glob('*.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              assert data['specification'] == 'RSMS-1.0'
              assert data['count'] == len(data['entries'])
              print(path, data['count'])
          PY

      - name: Release-readiness audit
        run: python tools/audit_rsms.py --release-readiness
