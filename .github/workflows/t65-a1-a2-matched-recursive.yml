name: T65 A1 A2 matched recursive intervention

on:
  push:
    branches:
      - work/v0.5-relational-ontology
    paths:
      - 'src/v05/t65_a1_a2_matched_recursive_intervention.py'
      - '.github/workflows/t65-a1-a2-matched-recursive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t65:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Execute frozen T65 A1+A2 matched intervention
        run: |
          set -euo pipefail
          python src/v05/t65_a1_a2_matched_recursive_intervention.py > t65_result.json
          cat t65_result.json
      - name: Preserve raw T65 output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t65-a1-a2-matched-recursive
          path: t65_result.json
          if-no-files-found: error
