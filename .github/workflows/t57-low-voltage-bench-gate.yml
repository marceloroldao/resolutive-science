name: T57 low-voltage bench data gate

on:
  push:
    branches:
      - work/v0.5-relational-ontology
    paths:
      - 'src/v05/t57_low_voltage_bench_calibration.py'
      - '.github/workflows/t57-low-voltage-bench-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t57-self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test frozen metrology gates with explicitly synthetic fixtures
        run: |
          set -euo pipefail
          python src/v05/t57_low_voltage_bench_calibration.py --self-test --output t57_selftest_result.json
      - name: Preserve synthetic software gate output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t57-synthetic-selftest-not-physical-measurement
          path: t57_selftest_result.json
          if-no-files-found: error
