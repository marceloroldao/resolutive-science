name: RCMS Protocol 16 T0 BOSS DR12 Intake

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  p16-t0:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install numpy
      - name: Execute preregistered P16-T0 intake gate
        run: python tools/run_rcms_protocol16_t0_boss_dr12.py
      - name: Verify no RCMS reveal occurred
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/rcms_protocol16_t0_boss_dr12.json').read_text())
          assert d['protocol']=='P16-T0'
          assert d['status']=='FINAL'
          assert d['RCMS_PARAMETER_EVALUATED'] is False
          assert d['classification']=='READY_FOR_BLIND_RCMS_REVEAL'
          print('P16_T0_FINAL_IDENTITY=PASS')
          print('RCMS_PARAMETER_EVALUATED=NO')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcms-protocol16-t0-boss-dr12
          path: results/rcms_protocol16_t0_boss_dr12.json
          if-no-files-found: error
