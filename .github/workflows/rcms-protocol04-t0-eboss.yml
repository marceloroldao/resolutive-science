name: RCMS Protocol 04 eBOSS T0

on:
  pull_request:
    paths:
      - 'docs/RCMS/data/eboss_dr16_protocol04_manifest.md'
      - 'tools/fetch_rcms_eboss_dr16.py'
      - 'tools/run_rcms_protocol04_t0_eboss.py'
      - '.github/workflows/rcms-protocol04-t0-eboss.yml'
  workflow_dispatch:

jobs:
  eboss-t0:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install numpy scipy
      - name: Fetch and verify frozen eBOSS DR16 inputs
        run: python tools/fetch_rcms_eboss_dr16.py
      - name: Run Protocol 04 P04-T0 baseline and identifiability gates
        run: python tools/run_rcms_protocol04_t0_eboss.py
