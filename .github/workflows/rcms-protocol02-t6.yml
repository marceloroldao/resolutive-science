name: RCMS Protocol 02 T6

on:
  pull_request:
    paths:
      - 'tools/run_rcms_protocol02_t6.py'
      - '.github/workflows/rcms-protocol02-t6.yml'
      - 'tools/run_rcms_protocol01_remaining_combos.py'
      - 'tools/fit_rcms_pantheonplus.py'
      - 'tools/run_rcms_real_hz.py'
      - 'tools/run_rcms_desi_dr2_bao.py'

jobs:
  t6:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy
      - run: python tools/fetch_rcms_pantheonplus.py
      - run: python tools/run_rcms_protocol02_t6.py
