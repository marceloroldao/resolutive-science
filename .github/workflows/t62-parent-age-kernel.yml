name: T62 parent-age kernel

on:
  push:
    branches:
      - work/v0.5-relational-ontology
    paths:
      - 'src/v05/t62_parent_age_kernel.py'
      - '.github/workflows/t62-parent-age-kernel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t62:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute frozen T62 parent-age holdout
        run: |
          set -euo pipefail
          python src/v05/t62_parent_age_kernel.py > t62_result.json
          cat t62_result.json
      - name: Preserve raw T62 output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t62-parent-age-kernel
          path: t62_result.json
          if-no-files-found: error
