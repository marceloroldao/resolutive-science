name: T79 expanded pool entropy balancing

on:
  push:
    branches:
      - work/v0.5-relational-ontology
    paths:
      - 'src/v05/t79_expanded_pool_entropy_balancing.py'
      - '.github/workflows/t79-expanded-pool-entropy-balancing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t79:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Execute frozen T79 expanded-pool balancing
        run: |
          set -euo pipefail
          python src/v05/t79_expanded_pool_entropy_balancing.py > t79_result.json
          cat t79_result.json
      - name: Preserve raw T79 output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t79-expanded-pool-entropy-balancing
          path: t79_result.json
          if-no-files-found: error
