name: T49 selection-pressure dose response

on:
  push:
    branches:
      - work/v0.5-relational-ontology
    paths:
      - 'src/v05/t49_selection_pressure_dose_response.py'
      - 'src/v05/t48_same_candidate_selection_operator_counterfactual.py'
      - 'src/v05/t47_degree_preserving_recursive_order_null.py'
      - 'src/v05/t39_higher_order_topology_source.py'
      - 'src/v05/t25_endogenous_dimension_scan.py'
      - '.github/workflows/t49-selection-pressure-dose-response.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t49:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Execute frozen T49
        run: |
          set -euo pipefail
          python src/v05/t49_selection_pressure_dose_response.py > t49_result.json
          cat t49_result.json

      - name: Preserve raw T49 result
        uses: actions/upload-artifact@v4
        with:
          name: t49-selection-pressure-dose-response
          path: t49_result.json
          if-no-files-found: error
