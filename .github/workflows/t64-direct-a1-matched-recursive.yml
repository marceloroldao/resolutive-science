name: T64 direct A1 matched recursive intervention

on:
  push:
    branches:
      - work/v0.5-relational-ontology
    paths:
      - 'src/v05/t64_direct_a1_matched_recursive_intervention.py'
      - '.github/workflows/t64-direct-a1-matched-recursive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Execute frozen T64 A1-matched intervention
        run: |
          set -euo pipefail
          python src/v05/t64_direct_a1_matched_recursive_intervention.py > t64_result.json
          cat t64_result.json
      - name: Preserve raw T64 output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t64-direct-a1-matched-recursive
          path: t64_result.json
          if-no-files-found: error
