name: RCMS Protocol 16 T1 BOSS DR12 Reveal Optimized

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  p16-t1-optimized:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install numpy
      - name: Execute computationally equivalent optimized P16-T1 reveal
        run: python tools/run_rcms_protocol16_t1_boss_dr12_reveal_optimized.py
      - name: Verify frozen P16-T1 identity and T0 closure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/rcms_protocol16_t1_boss_dr12_reveal.json').read_text())
          assert d['protocol']=='P16-T1'
          assert d['status']=='FINAL'
          assert d['T0_closure_pass'] is True
          assert d['prediction_interval']==[0.1219711,0.407494649]
          assert d['A_R_bounds']==[-1.0,1.0]
          assert d['A_R_step']==0.005
          print('P16_T1_OPTIMIZED_IDENTITY=PASS')
          print('P16_CLASSIFICATION='+d['classification'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcms-protocol16-t1-boss-dr12-optimized
          path: results/rcms_protocol16_t1_boss_dr12_reveal.json
          if-no-files-found: error
