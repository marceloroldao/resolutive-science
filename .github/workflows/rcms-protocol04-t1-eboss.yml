name: RCMS Protocol 04 eBOSS T1

on:
  pull_request:
    paths:
      - 'docs/RCMS/protocols/protocol04_t1_execution_freeze.md'
      - 'tools/run_rcms_protocol04_t1_eboss.py'
      - '.github/workflows/rcms-protocol04-t1-eboss.yml'
  workflow_dispatch:

jobs:
  eboss-t1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install numpy scipy
      - name: Fetch and verify frozen eBOSS DR16 inputs
        run: python tools/fetch_rcms_eboss_dr16.py
      - name: Re-run P04-T0 gate before reveal
        run: python tools/run_rcms_protocol04_t0_eboss.py
      - name: Run preregistered P04-T1 RCMS reveal
        run: python tools/run_rcms_protocol04_t1_eboss.py
      - name: Upload machine-readable P04-T1 result
        uses: actions/upload-artifact@v4
        with:
          name: rcms-protocol04-t1
          path: results/rcms_protocol04_t1.json
