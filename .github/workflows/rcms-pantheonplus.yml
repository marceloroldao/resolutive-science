name: RCMS Pantheon+ observational check

on:
  pull_request:
    paths:
      - 'tools/fetch_rcms_pantheonplus.py'
      - 'tools/fit_rcms_pantheonplus.py'
      - 'tests/test_pantheonplus_runner.py'
      - 'docs/RCMS/data/pantheonplus_v1.md'
      - '.github/workflows/rcms-pantheonplus.yml'
  workflow_dispatch:

jobs:
  pantheonplus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install observational dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.11,<2'
      - name: Unit-test likelihood mathematics
        run: python -m unittest tests/test_pantheonplus_runner.py -v
      - name: Fetch and verify frozen Pantheon+ bytes
        run: python tools/fetch_rcms_pantheonplus.py
      - name: Run preregistered Pantheon+ SN-alone comparison
        run: python tools/fit_rcms_pantheonplus.py
