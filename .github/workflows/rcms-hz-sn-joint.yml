name: RCMS H(z) + Pantheon+ joint check

on:
  pull_request:
    paths:
      - 'tools/run_rcms_hz_sn_joint.py'
      - 'tools/run_rcms_real_hz.py'
      - 'tools/fit_rcms_pantheonplus.py'
      - 'tools/fetch_rcms_pantheonplus.py'
      - 'data/rcms/cc_hz_moresco_bc03_v1.csv'
      - 'data/rcms/cc_systematics_moresco2020_v1.csv'
      - '.github/workflows/rcms-hz-sn-joint.yml'
  workflow_dispatch:

jobs:
  hz-sn-joint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install observational dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.11,<2'
      - name: Fetch and verify frozen Pantheon+ bytes
        run: python tools/fetch_rcms_pantheonplus.py
      - name: Run preregistered H(z)+Pantheon+ joint comparison
        run: python tools/run_rcms_hz_sn_joint.py
