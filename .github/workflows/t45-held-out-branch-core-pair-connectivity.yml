name: T45 held-out branch-core pair connectivity

on:
  push:
    branches:
      - work/v0.5-relational-ontology
    paths:
      - 'src/v05/t45_held_out_branch_core_pair_connectivity.py'
      - 'src/v05/t41_higher_order_matched_tree_null.py'
      - 'src/v05/t39_higher_order_topology_source.py'
      - 'src/v05/t38_degree_matched_tree_null.py'
      - 'src/v05/t25_endogenous_dimension_scan.py'
      - '.github/workflows/t45-held-out-branch-core-pair-connectivity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t45:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Execute frozen T45
        run: |
          set -euo pipefail
          python src/v05/t45_held_out_branch_core_pair_connectivity.py > t45_result.json
          cat t45_result.json

      - name: Preserve raw T45 result
        uses: actions/upload-artifact@v4
        with:
          name: t45-held-out-branch-core-pair-connectivity
          path: t45_result.json
          if-no-files-found: error
