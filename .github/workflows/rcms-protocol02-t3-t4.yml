name: RCMS Protocol 02 T3-T4

on:
  pull_request:
    paths:
      - 'tools/run_rcms_protocol02_t3_t4.py'
      - 'tools/fit_rcms_pantheonplus.py'
      - 'tools/fetch_rcms_pantheonplus.py'
      - 'tools/run_rcms_real_hz.py'
      - 'tools/run_rcms_desi_dr2_bao.py'
      - 'tools/run_rcms_protocol01_remaining_combos.py'
      - 'data/rcms/**'
      - '.github/workflows/rcms-protocol02-t3-t4.yml'

jobs:
  protocol02-t3-t4:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Fetch and verify frozen Pantheon+ bytes
        run: python tools/fetch_rcms_pantheonplus.py
      - name: Execute preregistered T3 and T4
        run: python tools/run_rcms_protocol02_t3_t4.py
