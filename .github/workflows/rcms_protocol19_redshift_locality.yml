name: RCMS Protocol 19 Redshift Locality

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/run_rcms_protocol17_residual_topology.py'
      - 'tools/run_rcms_protocol19_redshift_locality.py'
      - 'docs/RCMS/protocols/protocol19_redshift_locality.md'
      - 'data/rcms/desi_dr2_bao_all_mean.txt'
      - 'data/rcms/desi_dr2_bao_all_cov.txt'
      - '.github/workflows/rcms_protocol19_redshift_locality.yml'
  workflow_dispatch:

jobs:
  p19:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install numpy
      - name: Execute preregistered P19 diagnostic
        run: python tools/run_rcms_protocol19_redshift_locality.py
      - name: Verify P19 identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/rcms_protocol19_redshift_locality.json').read_text())
          assert d['protocol']=='P19'
          assert d['status']=='FINAL'
          assert d['seed']==190019
          assert d['N_simulations_per_survey']==2000
          assert set(d['surveys'])=={'DESI_DR2','BOSS_DR12'}
          assert d['classification'] in {
              'REDSHIFT_LOCALITY_RECURRENT',
              'REDSHIFT_LOCALITY_SURVEY_SPECIFIC',
              'REDSHIFT_LOCALITY_WEAK',
              'NO_REDSHIFT_LOCALITY_EVIDENCE',
          }
          for s in d['surveys'].values():
              assert 0 < s['look_elsewhere_p'] <= 1
              assert len(s['candidate_splits']) >= 1
          print('P19_FINAL_IDENTITY=PASS')
          print('P19_CLASSIFICATION='+d['classification'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rcms-protocol19-redshift-locality
          path: results/rcms_protocol19_redshift_locality.json
          if-no-files-found: error
